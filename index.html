<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --surface-3: #e8ebf0;
  --text: #15171a; --text-2: #50565f; --text-3: #7d8490; --border: #e2e5ea;
  --accent: #3e63dd; --accent-ink: #ffffff; --accent-soft: rgba(62,99,221,.12);
  --ok: #2b8a3e; --ok-soft: rgba(43,138,62,.12); --warn: #d9480f; --warn-soft: rgba(217,72,15,.12);
  --danger: #c92a2a; --danger-soft: rgba(201,42,42,.12);
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
  --radius: 14px; --radius-sm: 10px; --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #171a20; --surface-2: #1e222a; --surface-3: #272c36;
    --text: #eceef2; --text-2: #b0b6c3; --text-3: #838b9a; --border: #2b303a;
    --accent: #8ba4ff; --accent-ink: #0f1115; --accent-soft: rgba(139,164,255,.16);
    --ok: #69db7c; --ok-soft: rgba(105,219,124,.14); --warn: #ffa94d; --warn-soft: rgba(255,169,77,.14);
    --danger: #ff8787; --danger-soft: rgba(255,135,135,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #171a20; --surface-2: #1e222a; --surface-3: #272c36;
  --text: #eceef2; --text-2: #b0b6c3; --text-3: #838b9a; --border: #2b303a;
  --accent: #8ba4ff; --accent-ink: #0f1115; --accent-soft: rgba(139,164,255,.16);
  --ok: #69db7c; --ok-soft: rgba(105,219,124,.14); --warn: #ffa94d; --warn-soft: rgba(255,169,77,.14);
  --danger: #ff8787; --danger-soft: rgba(255,135,135,.14);
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  overflow-x: hidden;
}
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: .4rem 0; }
small, .muted { color: var(--text-2); }
.faint { color: var(--text-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Header ---------- */
.top {
  position: sticky; top: 0; z-index: 20; background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border); padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
}
.top-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.brand { font-weight: 700; font-size: 1.02rem; letter-spacing: -.01em; }
.brand-sub { font-size: .78rem; color: var(--text-2); }
.spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  display: inline-grid; place-items: center; cursor: pointer; padding: 0;
}
.icon-btn svg { width: 19px; height: 19px; }
.sync-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text-3); display: inline-block; }
.sync-dot.ok { background: var(--ok); } .sync-dot.busy { background: var(--warn); } .sync-dot.err { background: var(--danger); }

/* ---------- Layout ---------- */
main { max-width: 760px; margin: 0 auto; padding: 14px 16px 24px; }
.view { display: none; }
.view.active { display: block; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow);
}
.card.flat { box-shadow: none; }
.card-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.card-h h2, .card-h h3 { flex: 1; }
.section-title { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); font-weight: 650; margin: 18px 2px 8px; }
.notice { border-radius: var(--radius-sm); padding: 10px 12px; background: var(--surface-2); color: var(--text-2); font-size: .9rem; }
.notice.warn { background: var(--warn-soft); color: var(--text); }
.notice.ok { background: var(--ok-soft); color: var(--text); }
.notice.danger { background: var(--danger-soft); color: var(--text); }

/* ---------- Buttons & inputs ---------- */
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 12px;
  cursor: pointer; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; min-height: 38px;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.small { padding: 4px 9px; min-height: 30px; font-size: .86rem; border-radius: 8px; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="url"], select, textarea {
  border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 7px 9px; min-height: 36px; max-width: 100%;
}
textarea { width: 100%; min-height: 80px; resize: vertical; }
input[type="date"] { min-width: 0; }
label.field { display: grid; gap: 4px; font-size: .88rem; color: var(--text-2); }
label.field > span { font-weight: 550; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-weight: 550; color: var(--text-2); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.check { width: 22px; height: 22px; accent-color: var(--accent); flex: none; cursor: pointer; }

/* ---------- Chips, bars ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
  font-size: .74rem; font-weight: 600; background: var(--surface-2); color: var(--text-2); white-space: nowrap;
}
.chip.learn { background: var(--warn-soft); color: var(--warn); }
.chip.new { background: var(--accent-soft); color: var(--accent); }
.chip.due { background: var(--danger-soft); color: var(--danger); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.subj { background: var(--c-soft); color: var(--c-ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--accent)); flex: none; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 999px; transition: width .3s; }
.bar.thin { height: 5px; }
.stack-bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-3); }
.stack-bar > i { display: block; height: 100%; }

/* ---------- Today ---------- */
.hero { display: grid; gap: 4px; }
.hero h1 { font-size: 1.35rem; letter-spacing: -.015em; }
.daytag { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.block {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start;
  padding: 12px; border: 1px solid var(--border); border-left: 4px solid var(--c, var(--accent)); border-radius: 12px; background: var(--surface);
}
.block + .block { margin-top: 8px; }
.block.done { opacity: .62; }
.block.done .block-title { text-decoration: line-through; }
.block select { width: 100%; }
.block-time { font-variant-numeric: tabular-nums; font-size: .82rem; color: var(--text-2); }
.block-title { font-weight: 650; }
.block-meta { font-size: .84rem; color: var(--text-2); margin-top: 2px; }
.block-method { font-size: .82rem; color: var(--text-2); margin-top: 6px; display: none; }
.block.open .block-method { display: block; }
.block-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.rate { display: inline-flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.rate button { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 3px 9px; cursor: pointer; font-weight: 650; font-size: .82rem; }
.rate button.on1 { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.rate button.on2 { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.rate button.on3 { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.list { display: grid; gap: 0; }
.li { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
.li:last-child { border-bottom: 0; }
.li-main { flex: 1; min-width: 0; }
.li-title { font-weight: 600; overflow-wrap: anywhere; }
.li-sub { font-size: .82rem; color: var(--text-2); }
.count { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; white-space: nowrap; }
.count small { display: block; font-weight: 500; font-size: .72rem; color: var(--text-2); }
.count.soon { color: var(--warn); } .count.urgent { color: var(--danger); } .count.past { color: var(--text-3); }
.cd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cd { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border-left: 4px solid var(--c, var(--accent)); }
.cd b { font-size: 1.25rem; font-variant-numeric: tabular-nums; display: block; }
.cd span { font-size: .78rem; color: var(--text-2); display: block; }

/* ---------- Subjects ---------- */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 7px 13px;
  cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: var(--text-2);
}
.tab.on { background: var(--c, var(--accent)); color: #fff; border-color: transparent; }
.tab.on .dot { background: #fff; }
details.cat { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
details.cat + details.cat { margin-top: 8px; }
details.cat > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-weight: 650; }
details.cat > summary::-webkit-details-marker { display: none; }
details.cat > summary .chev { transition: transform .2s; color: var(--text-3); }
details.cat[open] > summary .chev { transform: rotate(90deg); }
details.cat > .cat-body { padding: 0 10px 10px; }
details.sub { border-top: 1px solid var(--border); }
details.sub > summary { list-style: none; cursor: pointer; padding: 10px 4px; display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: .95rem; }
details.sub > summary::-webkit-details-marker { display: none; }
details.sub[open] > summary .chev { transform: rotate(90deg); }
.pp { font-size: .8rem; color: var(--text-2); padding: 0 4px 6px; }
.topic { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 9px 4px; border-top: 1px dashed var(--border); align-items: start; }
.topic-name { font-weight: 550; cursor: pointer; overflow-wrap: anywhere; }
.topic-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; align-items: center; }
.topic-more { margin-top: 8px; font-size: .86rem; color: var(--text-2); display: none; }
.topic.open .topic-more { display: block; }
.diff { letter-spacing: 1px; color: var(--text-3); font-size: .72rem; }
.cw-ms { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
.cw-ms:first-child { border-top: 0; }
.ms-edit { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; font-size: .82rem; color: var(--text-2); }
.ms-edit input[type="number"] { width: 70px; }
ul.tight { margin: 6px 0 0; padding-left: 18px; } ul.tight li { margin: 3px 0; }
.papers { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.paper-cell { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 9px; font-size: .84rem; }

/* ---------- Plan / calendar ---------- */
.weeknav { display: flex; align-items: center; gap: 8px; }
.weeknav h2 { flex: 1; text-align: center; font-size: 1rem; }
.day { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 10px 12px; }
.day + .day { margin-top: 8px; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.day-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.day-h b { font-size: .95rem; }
.mini { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; font-size: .86rem; }
.mini .t { color: var(--text-2); font-variant-numeric: tabular-nums; width: 44px; flex: none; }
.mini .d { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; transform: translateY(1px); }
.mini .x { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.wk { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 10px 0; border-top: 1px solid var(--border); cursor: pointer; }
.wk:first-child { border-top: 0; }
.wk-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.wk-h b { font-size: .92rem; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .78rem; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* ---------- Timer ---------- */
.timer-face { text-align: center; padding: 18px 0 8px; }
.timer-ring { width: min(260px, 72vw); aspect-ratio: 1; margin: 0 auto; position: relative; }
.timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-ring .track { stroke: var(--surface-3); }
.timer-ring .prog { stroke: var(--c, var(--accent)); transition: stroke-dashoffset .5s linear; }
.timer-time { position: absolute; inset: 0; display: grid; place-content: center; gap: 2px; }
.timer-time b { font-size: clamp(2.2rem, 11vw, 3.2rem); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.timer-time span { color: var(--text-2); font-size: .9rem; }
.timer-ctrl { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.range-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

/* ---------- Bottom nav ---------- */
nav.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.bottom .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
nav.bottom button {
  border: 0; background: transparent; display: grid; place-items: center; align-content: center; gap: 3px; cursor: pointer;
  color: var(--text-3); font-size: .72rem; font-weight: 600; padding: 0;
}
nav.bottom button svg { width: 22px; height: 22px; }
nav.bottom button.on { color: var(--accent); }
.timer-pill { position: fixed; right: 12px; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px); z-index: 25;
  background: var(--text); color: var(--bg); border-radius: 999px; padding: 7px 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  box-shadow: 0 4px 14px rgba(0,0,0,.2); border: 0; cursor: pointer; display: none; }
.timer-pill.show { display: inline-flex; gap: 6px; align-items: center; }

/* ---------- Modal & toast ---------- */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(10,12,16,.45); display: none; align-items: flex-end; justify-content: center; padding: 12px; }
.modal.show { display: flex; }
.sheet { background: var(--surface); border-radius: 18px; width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; padding: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
@media (min-width: 640px) { .modal { align-items: center; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px); z-index: 60;
  background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: .9rem; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; }
code.sid { font-size: .84rem; background: var(--surface-2); padding: 6px 8px; border-radius: 8px; display: block; overflow-wrap: anywhere; user-select: all; }
hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
.hide { display: none !important; }
</style>
</head>

<script>
(() => {
'use strict';

/* =========================================================================
   Helpers
   ========================================================================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const DAYKEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const DAYNAME = { sun: 'Sunday', mon: 'Monday', tue: 'Tuesday', wed: 'Wednesday', thu: 'Thursday', fri: 'Friday', sat: 'Saturday' };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

const toDate = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12, 0, 0); };
const isoOf = dt => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const todayISO = () => isoOf(new Date());
const DN = new Map(), ND = new Map();                       // ISO date <-> day number caches (fast planner maths)
const dayNum = iso => { let n = DN.get(iso); if (n === undefined) { const [y, m, d] = iso.split('-').map(Number); n = Math.round(Date.UTC(y, m - 1, d) / 86400000); DN.set(iso, n); } return n; };
const isoFromNum = n => { let s = ND.get(n); if (s === undefined) { const dt = new Date(n * 86400000); s = `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`; ND.set(n, s); } return s; };
const addDays = (iso, n) => isoFromNum(dayNum(iso) + n);
const diffDays = (a, b) => dayNum(b) - dayNum(a); // b − a
const wdOf = iso => DAYKEYS[toDate(iso).getDay()];
const mondayOf = iso => { const d = toDate(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoOf(d); };
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const fmtD = (iso, o = {}) => { if (!iso) return 'TBC'; const d = toDate(iso); return `${o.noWd ? '' : DAYNAME[DAYKEYS[d.getDay()]].slice(0, 3) + ' '}${d.getDate()} ${MON[d.getMonth()]}${o.year ? ' ' + d.getFullYear() : ''}`; };
const fmtLong = iso => { const d = toDate(iso); return `${DAYNAME[DAYKEYS[d.getDay()]]} ${d.getDate()} ${MONTH[d.getMonth()]}`; };
const hm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const toMin = s => { const [h, m] = String(s || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const hexA = (hex, a) => { const n = parseInt(String(hex).slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
const now = () => Date.now();
const uid = () => now().toString(36) + Math.random().toString(36).slice(2, 8);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const hrs = mins => { const h = mins / 60; return (Math.round(h * 10) / 10).toString().replace(/\.0$/, '') + ' h'; };
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;

function relDays(iso) {
  if (!iso) return { txt: 'TBC', cls: '' };
  const n = diffDays(todayISO(), iso);
  if (n === 0) return { txt: 'today', cls: 'urgent', n };
  if (n === 1) return { txt: 'tomorrow', cls: 'urgent', n };
  if (n < 0) return { txt: `${-n}d ago`, cls: 'past', n };
  return { txt: n < 60 ? `${n} days` : `${Math.round(n / 7)} weeks`, cls: n <= 7 ? 'urgent' : n <= 21 ? 'soon' : '', n };
}

/* =========================================================================
   Indexes over DATA
   ========================================================================= */
const SUBJ = {}, TOPIC = {}, MS = {}, CW = {}, DATE = {}, TOPICS_BY = {};
const SUBJ_ORDER = DATA.subjects.map(s => s.id);
DATA.subjects.forEach(s => {
  SUBJ[s.id] = s;
  s.soft = hexA(s.color, 0.14);
  TOPICS_BY[s.id] = [];
  s.cats.forEach(c => c.subs.forEach(sb => sb.topics.forEach(t => {
    const T = Object.assign({}, t, { subj: s.id, cat: c.id, sub: sb.id, g: sb.g || null, catName: c.n, subName: sb.n, pp: sb.pp || '' });
    TOPIC[t.id] = T; TOPICS_BY[s.id].push(T);
  })));
});
DATA.coursework.forEach(c => { CW[c.id] = c; c.milestones.forEach(m => { MS[m.id] = Object.assign({}, m, { cw: c.id, subj: c.subj }); }); });
DATA.dates.forEach(d => { DATE[d.id] = d; });
const RAMP_FROM = DATA.defaults.oralRampFrom || '2027-01-01';
const PAPER_PARTS = {
  eng: { P1: ['Question A (40 min)', 'Question B (30 min)', 'Composition – plan + write'], P2: ['Single text – Othello', 'Comparative answer', 'Unseen + prescribed poetry'] },
  mat: { P1: ['Section A – two questions', 'Section A – two more', 'Section B – one question', 'Section B – another'], P2: ['Section A – two questions', 'Section A – two more', 'Section B – one question', 'Section B – another'] },
  phy: { Paper: ['Question 1', 'Two long questions', 'Two more long questions'] },
  iri: { P1: ['Cluastuiscint (with the audio)', 'Ceapadóireacht – one piece'], P2: ['Léamhthuiscint A & B', 'Prós + filíocht questions'] },
  dcg: { Paper: ['Section A – 3 short questions', 'Section B – one long question', 'Section B – second long question', 'Section C – your option'] },
  geo: { Paper: ['Short questions (10 of 12)', 'Physical long question', 'Regional long question', 'Elective long question', 'Option essay'] },
  tec: { Paper: ['Question 1 – 12 short parts', 'Core long question', 'Option questions'] }
};

/* =========================================================================
   State (localStorage) — synced parts live in `state`
   ========================================================================= */
const LS = { state: 'lcplan.state.v1', theme: 'lcplan.theme', sid: 'lcplan.syncId', sb: 'lcplan.supabase', timer: 'lcplan.timer', ui: 'lcplan.ui', onb: 'lcplan.onboarded' };
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); } catch (e) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const MAPS = ['topics', 'ms', 'dates', 'papers', 'logs', 'blocksDone', 'frozen', 'notes'];
const blankState = () => ({ v: 1, updatedAt: 0, settings: null, topics: {}, ms: {}, dates: {}, papers: {}, logs: {}, blocksDone: {}, frozen: {}, notes: {} });
function normalise(st) {
  const b = blankState();
  if (!st || typeof st !== 'object') return b;

  const ids = KEY_COUNTDOWNS.filter(id => { const d = getDate(id); return d && d >= t; });
  if (getDate('oral-day') && getDate('oral-day') >= t) { const i = ids.indexOf('oral-start'); if (i >= 0) ids[i] = 'oral-day'; }

  return `<div class="card"><div class="card-h"><h3>Countdowns</h3><button class="btn small ghost" data-act="nav" data-view="dates">All dates</button></div><div class="cd-grid">${ids.map(id => {
    const d = DATE[id], dt = getDate(id), n = diffDays(t, dt);
    return `<div class="cd" style="${subjStyle(d.subj || 'eng')}${d.subj ? '' : ';--c:var(--accent)'}"><b>${n}</b><span>days · ${esc(fmtD(dt))}</span><span>${esc(d.label.replace(' – SEC deadline', ' (SEC)'))}</span></div>`;
  }).join('')}</div></div>`;
}
function reviewsCard(t) {
  const due = Object.values(TOPIC).filter(x => topicActive(x) && tp(x.id).next && tp(x.id).next <= t);
  due.sort((a, b) => tp(a.id).next.localeCompare(tp(b.id).next));
  if (!due.length) return '';
  return `<div class="card"><div class="card-h"><h3>Reviews due (${due.length})</h3></div><p class="muted" style="font-size:.85rem">These come up in your blocks automatically. If you have spare minutes, quiz yourself and re-rate.</p><div class="list">${due.slice(0, 6).map(x => `<div class="li"><span class="dot" style="${subjStyle(x.subj)}"></span><div class="li-main"><div class="li-title">${esc(topicName(x.id))}</div><div class="li-sub">${esc(SUBJ[x.subj].name)} · due ${esc(fmtD(tp(x.id).next))}</div></div><div class="rate" style="margin:0">${[1, 2, 3].map(n => `<button type="button" data-act="trate" data-id="${esc(x.id)}" data-c="${n}" title="${CONF_LABEL[n]}">${n}</button>`).join('')}</div></div>`).join('')}</div></div>`;
}
function weekCard(t) {
  const mon = mondayOf(t), planned = {}, logged = {};
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), dp = dayPlan(d);
    (dp.blocks || []).forEach(b => { planned[b.subj] = (planned[b.subj] || 0) + b.mins; });
  }
  Object.values(state.logs).forEach(l => { if (l && !l.deleted && l.d >= mon && l.d <= addDays(mon, 6)) logged[l.s] = (logged[l.s] || 0) + (+l.m || 0); });
  const rows = SUBJ_ORDER.filter(id => planned[id] || logged[id]).map(id => {
    const p = planned[id] || 0, l = logged[id] || 0, pct = p ? clamp(Math.round(l / p * 100), 0, 100) : (l ? 100 : 0);
    return `<div class="li" style="${subjStyle(id)}"><span class="dot"></span><div class="li-main"><div class="row"><b style="flex:1">${esc(SUBJ[id].name)}</b><span class="faint" style="font-size:.82rem">${hrs(l)} timed / ${hrs(p)} planned</span></div><div class="bar thin"><i style="width:${pct}%"></i></div></div></div>`;
  }).join('');
  return rows ? `<div class="card"><div class="card-h"><h3>This week</h3><span class="faint" style="font-size:.8rem">from the timer</span></div><div class="list">${rows}</div></div>` : '';
}

/* ---------- SUBJECTS ---------- */
function subjProgress(sid) {
  const list = TOPICS_BY[sid].filter(topicActive);
  let done = 0, conf = 0, rated = 0, due = 0;
  const t = todayISO();
  list.forEach(x => { const p = tp(x.id); if (p.done) done++; if (p.conf) { conf += p.conf; rated++; } if (p.next && p.next <= t) due++; });
  return { total: list.length, done, pct: list.length ? Math.round(done / list.length * 100) : 0, avg: rated ? (conf / rated) : 0, rated, due };
}
function renderSubjects() {
  const tabs = `<div class="tabs" role="tablist"><button class="tab ${ui.subj === 'all' ? 'on' : ''}" data-act="subj" data-id="all">Overview</button>${DATA.subjects.map(s => `<button class="tab ${ui.subj === s.id ? 'on' : ''}" style="${subjStyle(s.id)}" data-act="subj" data-id="${s.id}" role="tab"><span class="dot"></span>${esc(s.short)}</button>`).join('')}</div>`;
  let body = '';
  if (ui.subj === 'all' || !SUBJ[ui.subj]) body = overviewHTML();
  else body = subjectHTML(SUBJ[ui.subj]);
  $('#view-subjects').innerHTML = tabs + `<div class="stack">${body}</div>`;
}
function overviewHTML() {
  let all = 0, done = 0;

  <div class="card"><div class="card-h"><h3>Subjects</h3></div><div class="list">${rows}</div></div>
  <div class="card"><div class="card-h"><h3>Cross-subject overlaps</h3></div>${DATA.overlaps.map(o => `<details class="cat" style="margin-top:8px"><summary><span class="chev">›</span>${subjChip(o.a)}${subjChip(o.b)} ${esc(o.title)}</summary><div class="cat-body"><p>${esc(o.text)}</p></div></details>`).join('')}</div>
  ${allocationHTML()}`;
}

/* ---------- PLAN ---------- */
function renderPlan() {
  const t = todayISO();
  if (!ui.weekOf || ui.weekOf < mondayOf(t) && ui.planMode === 'week' && !ui.weekPinned) ui.weekOf = mondayOf(t);
  let h = `<div class="stack"><div class="row"><div class="seg" role="tablist"><button class="${ui.planMode === 'week' ? 'on' : ''}" data-act="pmode" data-m="week">Week</button><button class="${ui.planMode === 'year' ? 'on' : ''}" data-act="pmode" data-m="year">Whole year</button></div><div class="spacer"></div><button class="btn small" data-act="wk" data-d="0">Today</button></div>`;
  h += ui.planMode === 'year' ? yearHTML() : weekHTML(ui.weekOf);
  h += `</div>`;
  $('#view-plan').innerHTML = h;
}
function weekAgg(mon) {
  const agg = { subj: {}, cw: 0, total: 0, days: [] };
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), dp = dayPlan(d);
    agg.days.push({ iso: d, dp });
    (dp.blocks || []).forEach(b => { agg.subj[b.subj] = (agg.subj[b.subj] || 0) + b.mins; agg.total += b.mins; if (b.kind === 'cw') agg.cw += b.mins; });
  }
  return agg;
}
function deadlinesIn(a, b) {
  const items = [];
  DATA.dates.forEach(d => { const dt = getDate(d.id); if (dt && dt >= a && dt <= b && !(d.type === 'exam' && !d.subj && d.id !== 'ex-start')) items.push({ dt, title: d.label, subj: d.subj }); });
  Object.values(MS).forEach(m => { const st = msState(m.id); if (st.due >= a && st.due <= b && !st.done && m.where === 'home') items.push({ dt: st.due, title: 'Milestone: ' + m.n, subj: m.subj }); });
  getBreaks().forEach(br => { if (br.start >= a && br.start <= b) items.push({ dt: br.start, title: br.name + ' starts', subj: null }); });
  return items.sort((x, y) => x.dt.localeCompare(y.dt));
}
function stackBar(agg) {
  const tot = agg.total || 1;
  return `<div class="stack-bar">${SUBJ_ORDER.filter(id => agg.subj[id]).map(id => `<i style="width:${agg.subj[id] / tot * 100}%;background:${SUBJ[id].color}" title="${esc(SUBJ[id].name)} ${hrs(agg.subj[id])}"></i>`).join('')}</div>`;
}
function weekHTML(mon) {

    <p style="font-size:.88rem"><b>How the planner works.</b> Every day from today to the end of the exams is generated from your hours, the school calendar, coursework milestones and your topic ratings. Coursework milestones get blocks spread evenly before their due date (DCG SolidWorks parts stay in school). The rest is split between subjects by the weights shown under Subjects → Overview, then within each subject by the marks each section carries. Each topic is picked by how often it's examined, difficulty, your confidence and its spaced-repetition due date. Physics topics your class is about to cover come first ("Learn" blocks), and poems rotate between poets. Rating a topic 1 brings it back tomorrow, 2 in about 3–20 days, 3 in about 1–6 weeks. Today's plan is fixed once it's made (Rebuild regenerates it). Mocks don't change anything, as you asked.</p>

function markBlock(key, done) {
  const iso = key.slice(0, 10), id = key.slice(11), fz = state.frozen[iso];
  const b = fz && Array.isArray(fz.blocks) ? fz.blocks.find(x => x.id === id) : null;
  const prev = !!(state.blocksDone[key] || {}).done;
  if (prev === done) return;
  state.blocksDone[key] = Object.assign({}, state.blocksDone[key] || {}, { done, _t: now() });
  if (b && b.kind === 'cw' && b.ms) {
    const st = msState(b.ms), left = Math.max(0, Math.round((st.left + (done ? -1 : 1) * b.mins / 60) * 100) / 100);
    state.ms[b.ms] = Object.assign({}, state.ms[b.ms] || {}, { left, _t: now() });
    if (done && left === 0) toast(`No hours left on “${MS[b.ms].n}” – tick the milestone off when it's really finished.`);
  }
  if (b && b.kind === 'paper' && b.paper && done) {
    const v = state.papers[b.paper.key] || {}, parts = Math.max(v.parts || 0, b.paper.idx + 1);
    state.papers[b.paper.key] = { parts, done: parts >= b.paper.of || !!v.done, _t: now() };
  }
  save(); invalidate();
}
function findBlock(key) {
  const iso = key.slice(0, 10), id = key.slice(11), fz = state.frozen[iso];
  return fz && Array.isArray(fz.blocks) ? fz.blocks.find(x => x.id === id) : null;
}

/* ---------- modal & toast ---------- */

/* =========================================================================
   Sync — Supabase (supabase-js v2 from CDN), keyed by the random sync ID
   ========================================================================= */
function sbConfig() {
  if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY) return { url: CONFIG.SUPABASE_URL.replace(/\/+$/, ''), key: CONFIG.SUPABASE_KEY };
  const o = lsGet(LS.sb, null) || {};
  return { url: o.url || '', key: o.key || '' };
}
function mergeState(a, b) {
  const out = blankState();
  out.settings = (b.settings && (!a.settings || (b.settings._t || 0) > (a.settings._t || 0))) ? b.settings : a.settings;
  MAPS.forEach(k => {
    const A = a[k] || {}, B = b[k] || {};
    new Set([...Object.keys(A), ...Object.keys(B)]).forEach(id => {
      const x = A[id], y = B[id];
      out[k][id] = !x ? y : !y ? x : ((y._t || 0) > (x._t || 0) ? y : x);
    });
  });
  out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return out;
}
const Sync = {
  client: null, status: 'off', err: '', last: 0, busy: false, timer: null, loading: null,
  dot() { return { ok: 'ok', busy: 'busy', err: 'err' }[this.status] || ''; },
  message() {
    const c = sbConfig();
    if (!c.url || !c.key) return 'Not connected – progress is saved on this device only. Follow SUPABASE_SETUP.md, then paste your project URL and key below.';
    if (this.status === 'offline') return 'Offline – changes are saved on this device and will sync when you are back online.';
    if (this.status === 'err') return 'Sync problem: ' + this.err;
    if (this.status === 'busy') return 'Syncing…';
    if (this.last) return 'Synced ' + new Date(this.last).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '.';
    return 'Connected.';
  },
  setStatus(s, err) { this.status = s; this.err = err || ''; const d = $('#syncDot'); if (d) { d.className = 'sync-dot ' + this.dot(); d.title = this.message(); } },
  reset() { this.client = null; this.setStatus('off'); },
  async lib() {
    if (window.supabase && window.supabase.createClient) return window.supabase;
    if (!this.loading) this.loading = new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = CONFIG.SUPABASE_CDN; sc.async = true;
      sc.onload = () => window.supabase ? res(window.supabase) : rej(new Error('supabase-js did not load'));
      sc.onerror = () => { this.loading = null; rej(new Error('could not load supabase-js (offline?)')); };
      document.head.appendChild(sc);
    });
    return this.loading;
  },
  async getClient() {
    if (this.client) return this.client;
    const c = sbConfig(); if (!c.url || !c.key) return null;
    const lib = await this.lib();
    this.client = lib.createClient(c.url, c.key, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    return this.client;
  },
  schedule: debounce(function () { Sync.sync(false); }, 2500),
  async sync(manual) {
    const c = sbConfig();
    if (!c.url || !c.key) { this.setStatus('off'); return; }
    if (!navigator.onLine) { this.setStatus('offline'); return; }
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.setStatus('busy');
    try {
      const client = await this.getClient();
      const id = syncId();
      const pull = await client.rpc('sync_pull', { p_sync_id: id });
      if (pull.error) throw pull.error;
      const row = Array.isArray(pull.data) ? pull.data[0] : pull.data;
      if (row && row.data) {
        const merged = mergeState(state, normalise(row.data));
        const changed = JSON.stringify(merged) !== JSON.stringify(state);
        if (changed) { state = merged; lsSet(LS.state, state); invalidate(); render(); }
      }
      const push = await client.rpc('sync_push', { p_sync_id: id, p_data: state });
      if (push.error) throw push.error;
      this.last = now(); this.setStatus('ok');
      if (manual) toast('Synced');
    } catch (e) {
      const msg = (e && (e.message || e.hint || e.details)) || String(e);
      this.setStatus(navigator.onLine ? 'err' : 'offline', msg);
      if (manual) toast('Sync failed: ' + msg);
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; this.schedule(); }
      if (ui.view === 'settings') renderSettings();
    }
  }
};
window.addEventListener('online', () => Sync.sync(false));
window.addEventListener('offline', () => Sync.setStatus('offline'));
